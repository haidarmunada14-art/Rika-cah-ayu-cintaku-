<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Jaga Kesehatan 🤍</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #cfd9df, #e2ebf0);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      background: white;
      padding: 28px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      max-width: 360px;
      animation: fadeIn 1.2s ease;
    }
    h1 {
      color: #4a6fa5;
      margin-bottom: 12px;
    }
    p {
      color: #444;
      line-height: 1.7;
      font-size: 15px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Jaga Kesehatan ya 🤍</h1>
    <p>
      Jangan lupa makan.  
      Jangan lupa mandi.
    </p>
    <p>
      Jangan begadang.  
      Jangan kebut-kebutan.
    </p>
    <p>
      Kesehatan kamu dijaga ya.  
      Aku enggak mau kamu sakit.
    </p>
  </div>
</body>
</html>
